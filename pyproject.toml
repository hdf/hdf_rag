[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hdf-rag"
version = "0.1.0"
description = "Local multilingual document retrieval with FastAPI and Qdrant"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "qdrant-client==1.19.0",
  "sentence-transformers==6.0.1",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "httpx2==2.12.0", "ruff==0.16.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: integration test requiring the downloaded embedding model"]

[tool.ruff]
target-version = "py311"
line-length = 100
